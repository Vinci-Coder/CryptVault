version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cryptvault_db
      POSTGRES_USER: cryptvault
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptvault -d cryptvault_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Aplicação CryptVault Core
  cryptvault-core:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://cryptvault:password@postgres:5432/cryptvault_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - SECRET_KEY=dev-app-secret-change-in-production
      - AUTH_MANAGER_URL=http://auth-manager:8001
      - AUTH_MANAGER_API_KEY=dev-auth-api-key
      - CRYPTO_SERVICE_URL=http://crypto-service:8002
      - CRYPTO_SERVICE_API_KEY=dev-crypto-api-key
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:8080"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./logs:/app/logs

  # Mock do MS-AuthManager (para desenvolvimento)
  auth-manager-mock:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./mocks/auth-manager:/usr/share/nginx/html
    restart: unless-stopped

  # Mock do Crypto Service (para desenvolvimento)
  crypto-service-mock:
    image: nginx:alpine
    ports:
      - "8002:80"
    volumes:
      - ./mocks/crypto-service:/usr/share/nginx/html
    restart: unless-stopped

  # Adminer para administração do banco (desenvolvimento)
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - dev

  # Grafana para monitoramento (desenvolvimento)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: cryptvault-network

